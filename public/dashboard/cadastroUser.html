<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPOT | Painel de Monitorização</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/cadastro-login.css">

    <script src="../js/sessao.js" defer></script>
    <script src="../js/alerta.js" defer></script>
</head>

<body onload="exibirMaquinas()">
    <div class="layout-aplicacao">

        <aside class="barra-lateral">
            <div class="area-marca">
                <img src="../assets/icon/logo-branca.png" alt="Logo SPOT" class="imagem-logo">
            </div>

            <nav class="menu-lateral">
                <a href="cardsAdmin.html" class="item-menu">
                    <i class="fa-solid fa-gear"></i>
                    <span>Configurações</span>
                </a>
                
                <a href="#" class="item-menu">
                    <i class="fa-solid fa-server"></i>
                    <span>Cadastrar Nova Máquina</span>
                </a>

                <a href="cadastroUser.html" class="item-menu">
                    <i class="fa-solid fa-server"></i>
                    <span>Cadastrar Novo Usuário</span>
                </a>
            </nav>

            <div class="rodape-lateral">
                <div class="linha-rodape"></div>
                <p>Mais controle,<br>menos riscos.</p>
            </div>
        </aside>

        <main class="conteudo-principal">

            <header class="cabecalho-superior">
                <nav class="navegacao-cabecalho">
                    <a href="#" class="aba-navegacao activa">
                        <i class="fa-solid fa-house"></i>
                        <span>Início</span>
                    </a>
                </nav>

                <div class="perfil-usuario">
                <div class="avatar-usuario">
                    <i class="fa-solid fa-user"></i>
                </div>
                <span class="nome-usuario">Olá, <strong id="b_usuario">User</strong></span>

                <div class="menu-dropdown-usuario" id="menu-dropdown-usuario">
                    <a href="../login.html" class="item-dropdown-logout" onclick="limparSessao()">
                <i class="fa-solid fa-right-from-bracket"></i>
                </a>
                </a>
                </div>
            </div>
            </header>

    <div class="login">
    
    <div class="container">
      <div class="card card-cadastro">
        <div class="form-contato">

          <h2>Bem-vindo ao seu Cadastro SPOT</h2>

          <p>

            Junte-se à SPOT e transforme o monitoramento da sua infraestrutura
             com inteligência e prevenção.

          </p>

          <form class="form-contato" onsubmit="return cadastrar()">

            <input type="text" id="nome_input" placeholder="Nome" required>

            <select id="cargo_input" required>

              <option value="" disabled selected hidden>Selecione o cargo</option>
              <option value="Analista de TI">Analista de TI</option>
              <option value="Gestor de TI">Gestor(a) de TI</option>

            </select>

            <input type="text" id="cpf_input" placeholder="CPF" maxlength="11" required inputmode="numeric">

            <input type="email" id="email_input" placeholder="E-mail" required>

            <input type="text" id="codigo_input" placeholder="Código da Empresa" required>

            <input type="password" id="senha_input" placeholder="Senha" required>

            <input type="password" id="confirmacao_senha_input" placeholder="Confirmar Senha" required>

            <button type="submit">CADASTRE-SE</button>

            <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>

          </form>

          <div id="div_erros_login"></div>
        </div>
      </div>
    </div>
  

    <script>

        // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var cargoVar = cargo_input.value;
    var cpfVar = cpf_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var codigoVar = codigo_input.value;
    var idEmpresaVincular

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      cargoVar == "" || 
      cpfVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      codigoVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    if (cpfVar.length != 11 || isNaN(cpfVar)) {

    cardErro.style.display = "block";

    mensagem_erro.innerHTML =
        "O CPF deve possuir 11 números.";

    setTimeout(sumirMensagem, 5000);

    return false;
}

    if (!emailVar.includes("@")) {
      
      cardErro.style.display = "block";
      
      mensagem_erro.innerHTML =
        "Informe um e-mail válido.";
        
        setTimeout(sumirMensagem, 5000); return false; }

    if (senhaVar.length < 8 ) {

    cardErro.style.display = "block";

    mensagem_erro.innerHTML =
        "A senha deve possuir pelo menos 8 caracteres.";

    setTimeout(sumirMensagem, 5000);

    return false;
}

    if (senhaVar != confirmacaoSenhaVar) {
      
      cardErro.style.display = "block";
      
      mensagem_erro.innerHTML =
        "As senhas não coincidem.";
        
        setTimeout(sumirMensagem, 5000); return false; }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {

    if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {

        idEmpresaVincular = listaEmpresasCadastradas[i].id_empresa;

        console.log("Código de ativação válido.");

        break;
    }
}

if (idEmpresaVincular == undefined) {

    cardErro.style.display = "block";

    mensagem_erro.innerHTML =
        "Código da empresa inválido.";

    setTimeout(sumirMensagem, 5000);

    return false;
}

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        cargoServer: cargoVar,
        cpfServer: cpfVar,
        senhaServer: senhaVar,
        idEmpresaVincularServer: idEmpresaVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.classList.add("card_sucesso");
mensagem_erro.innerHTML =
    "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // Listando empresas cadastradas 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].codigo_ativacao)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }

        function limparSessao() {
            sessionStorage.clear();
        }


        function navegarParaDashboard(idMaquina) {
            sessionStorage.ID_MAQUINA = idMaquina;
            window.location.href = "./dashboardAdmin.html";
        }

        const listaMaquinas = [
            { id: "01", estado: "normal", cpu: 24, ram: 62, disco: 18 },
            { id: "02", estado: "atencao", cpu: 68, ram: 73, disco: 41 },
            { id: "03", estado: "critico", cpu: 92, ram: 88, disco: 76 },
            { id: "04", estado: "normal", cpu: 31, ram: 48, disco: 22 },
            { id: "05", estado: "normal", cpu: 27, ram: 59, disco: 34 },
            { id: "06", estado: "atencao", cpu: 71, ram: 66, disco: 49 },
        ];

        function exibirMaquinas() {
            const container = document.getElementById("grelha-maquinas");
            container.innerHTML = "";

            let totalNormal = 0, totalAtencao = 0, totalCritico = 0;

            const configuracaoEtiqueta = {
                normal: { classe: "etiqueta-normal", texto: "Normal" },
                atencao: { classe: "etiqueta-atencao", texto: "Atenção" },
                critico: { classe: "etiqueta-critica", texto: "Crítico" }
            };

            listaMaquinas.forEach(item => {
                if (item.estado === "normal") totalNormal++;
                if (item.estado === "atencao") totalAtencao++;
                if (item.estado === "critico") totalCritico++;

                const config = configuracaoEtiqueta[item.estado] || configuracaoEtiqueta.normal;

                container.innerHTML += `
                    <div class="cartao-maquina" onclick="navegarParaDashboard('${item.id}')">
                        <div class="cabecalho-cartao">
                            <div class="info-maquina">
                                <i class="fa-solid fa-server icone-maquina"></i>
                                <h4>ID da máquina-${item.id}</h4>
                            </div>
                            <span class="etiqueta-estado ${config.classe}">
                                <span class="ponto-etiqueta"></span> ${config.texto}
                            </span>
                        </div>
                        <div class="lista-metricas">
                            <div class="linha-metrica">
                                <span class="rotulo-metrica">CPU</span>
                                <div class="fundo-barra-progresso">
                                    <div class="preenchimento-barra-progresso" style="width: ${item.cpu}%;"></div>
                                </div>
                                <span class="valor-metrica">${item.cpu}%</span>
                            </div>
                            <div class="linha-metrica">
                                <span class="rotulo-metrica">RAM</span>
                                <div class="fundo-barra-progresso">
                                    <div class="preenchimento-barra-progresso" style="width: ${item.ram}%;"></div>
                                </div>
                                <span class="valor-metrica">${item.ram}%</span>
                            </div>
                            <div class="linha-metrica">
                                <span class="rotulo-metrica">Disco</span>
                                <div class="fundo-barra-progresso">
                                    <div class="preenchimento-barra-progresso" style="width: ${item.disco}%;"></div>
                                </div>
                                <span class="valor-metrica">${item.disco}%</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById("indicador-total").innerText = listaMaquinas.length;
            document.getElementById("indicador-normal").innerText = totalNormal;
            document.getElementById("indicador-atencao").innerText = totalAtencao;
            document.getElementById("indicador-critico").innerText = totalCritico;
        }
    </script>
</body>

</html>
