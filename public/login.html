<script>

function entrar() {

    aguardar();

    var emailVar = email_input.value;
    var senhaVar = senha_input.value;

    if (emailVar == "" || senhaVar == "") {

        finalizarAguardar();

        div_erros_login.classList.remove("conectando");
        div_erros_login.style.display = "block";
        div_erros_login.innerHTML = "Preencha todos os campos.";

        return false;

    }

    div_erros_login.classList.add("conectando");
    div_erros_login.style.display = "block";
    div_erros_login.innerHTML = "Conectando...";

    console.log("FORM LOGIN: ", emailVar);
    console.log("FORM SENHA: ", senhaVar);

    fetch("/usuarios/autenticar", {

        method: "POST",

        headers: {

            "Content-Type": "application/json"

        },

        body: JSON.stringify({

            emailServer: emailVar,

            senhaServer: senhaVar

        })

    }).then(function (resposta) {

        console.log("ESTOU NO THEN DO entrar()!")

        if (resposta.ok) {

            console.log(resposta);

            resposta.json().then(json => {

                console.log(json);

                console.log(JSON.stringify(json));

                sessionStorage.EMAIL_USUARIO = json.email;

                sessionStorage.NOME_USUARIO = json.nome;

                sessionStorage.ID_USUARIO = json.id_usuario;

                setTimeout(function () {

                    window.location = "./dashboard/cards.html";

                }, 1000);

            });

        } else {

            console.log("Houve um erro ao tentar realizar o login!");

            resposta.text().then(texto => {

                console.error(texto);

                div_erros_login.classList.remove("conectando");
                div_erros_login.style.display = "block";
                div_erros_login.innerHTML = texto;

                finalizarAguardar();

            });

        }

    }).catch(function (erro) {

        console.log(erro);

        div_erros_login.classList.remove("conectando");
        div_erros_login.style.display = "block";
        div_erros_login.innerHTML = "Erro ao conectar com o servidor.";

        finalizarAguardar();

    })

    return false;

}



</script>
